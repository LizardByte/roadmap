---
name: Update Repositories List in Roadmap
permissions: {}

on:
  workflow_dispatch:
    inputs:
      organizations:
        description: 'Optional comma-separated organizations; leave empty to use the shared organization registry'
        required: false
  schedule:
    - cron: '0 0 * * *'
  pull_request:
  push:
    branches:
      - master

jobs:
  update-repositories:
    name: Update Repository List
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get organizations
        id: get_orgs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          ORGANIZATIONS: ${{ inputs.organizations }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const override = (process.env.ORGANIZATIONS || '').trim();
            let orgs;
            if (override) {
              orgs = override.split(',').map(org => org.trim()).filter(Boolean);
            } else {
              const {data} = await github.rest.repos.getContent({
                owner: 'LizardByte',
                repo: '.github',
                path: 'organizations.json',
                ref: 'master'
              });
              orgs = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            }

            if (!Array.isArray(orgs) || orgs.length === 0 ||
                orgs.some(org => typeof org !== 'string' || !org.trim())) {
              throw new Error('Organizations must be a non-empty array of organization names');
            }
            orgs = [...new Set(orgs.map(org => org.trim()))];
            console.log(`Organizations to process: ${orgs.join(', ')}`);
            return orgs;

      - name: Fetch repositories
        id: fetch_repos
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          ORGANIZATIONS: ${{ steps.get_orgs.outputs.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const orgs = JSON.parse(process.env.ORGANIZATIONS);
            let allRepos = [];

            for (const org of orgs) {
              try {
                console.log(`Fetching repositories for organization: ${org}`);

                const opts = github.rest.repos.listForOrg.endpoint.merge({
                  org: org,
                  per_page: 100
                });

                const repos = await github.paginate(opts);
                console.log(`Successfully fetched ${repos.length} repositories from ${org}`);

                const activeRepos = repos
                  .filter(repo => !repo.archived)
                  .map(repo => repo.full_name);

                console.log(`Found ${activeRepos.length} active repositories for ${org}`);
                allRepos = [...allRepos, ...activeRepos];
              } catch (error) {
                console.error(`Error fetching repositories for organization ${org}:`, error);
                throw new Error(`Failed to fetch repositories for organization ${org}`);
              }
            }

            // Keep each canonical org/repo label once and ignore capitalization when sorting.
            allRepos = [...new Set(allRepos)];
            allRepos.sort((left, right) => left.localeCompare(right, 'en', {sensitivity: 'base'}));

            console.log(`Found ${allRepos.length} repositories across ${orgs.length} organization(s)`);
            return allRepos;

      - name: Update repositories dropdown
        id: update_dropdown
        uses: ShaMan123/gha-form-dropdown-options@124b08a39f06a6a4fcafdec501ecaca8db019db2  # v2.1.0
        with:
          form: .github/ISSUE_TEMPLATE/roadmap.yml
          template: .github/t_roadmap.yml
          dropdown: _repositories
          options: ${{ steps.fetch_repos.outputs.result }}
          dry_run: no-commit

      - name: git diff
        if: steps.update_dropdown.outputs.modified == 'true'
        run: git diff --color

      - name: Create/Update Pull Request
        id: create-pr
        if: |
          steps.update_dropdown.outputs.modified == 'true' &&
          github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          add-paths: |
            .github/ISSUE_TEMPLATE/*.yml
          token: ${{ secrets.GH_BOT_TOKEN }}
          commit-message: "chore: Update repositories list in roadmap.yml"
          author: "${{ vars.GH_BOT_NAME }} <${{ secrets.GH_BOT_EMAIL }}>"
          committer: "${{ vars.GH_BOT_NAME }} <${{ secrets.GH_BOT_EMAIL }}>"
          branch: bot/update-repositories-list
          delete-branch: true
          title: "chore: Update repositories list in roadmap.yml"
          body: |
            This PR updates the list of repositories in the roadmap issue template.
            The list was automatically generated by a GitHub Action.
          labels: |
            auto-approve
            auto-merge

      - name: Automerge PR
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        if: |
          steps.create-pr.outputs.pull-request-number != '' &&
          steps.update_dropdown.outputs.modified == 'true' &&
          github.event_name != 'pull_request'
        run: |
          gh pr merge \
            --auto \
            --delete-branch \
            --squash \
            "${{ steps.create-pr.outputs.pull-request-number }}"
